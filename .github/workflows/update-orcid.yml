name: Update ORCID Publications

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions tab

jobs:
  update-orcid:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and update ORCID works
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import re

          ORCID_ID = "0009-0005-5678-2210"
          url = f"https://pub.orcid.org/v3.0/{ORCID_ID}/works"
          req = urllib.request.Request(url, headers={"Accept": "application/json"})

          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read())

          rows = []
          for group in data.get("group", []):
              summary = group.get("work-summary", [{}])[0]
              title = (summary.get("title") or {}).get("title", {}).get("value", "").strip()
              pub_date = summary.get("publication-date") or {}
              year = (pub_date.get("year") or {}).get("value", "—")
              doi = ""
              for extid in ((summary.get("external-ids") or {}).get("external-id") or []):
                  if extid.get("external-id-type") == "doi":
                      doi = extid.get("external-id-value", "")
                      break
              if not title:
                  continue
              if doi:
                  rows.append(f"| {year} | [{title}](https://doi.org/{doi}) | ACM |")
              else:
                  rows.append(f"| {year} | {title} | — |")

          header = "| Year | Title | Venue |\n|---|---|---|"
          table = header + ("\n" + "\n".join(rows) if rows else "\n| — | No public works yet | — |")

          with open("README.md", "r") as f:
              content = f.read()

          updated = re.sub(
              r"<!-- ORCID-WORKS:START -->.*?<!-- ORCID-WORKS:END -->",
              f"<!-- ORCID-WORKS:START -->\n{table}\n<!-- ORCID-WORKS:END -->",
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(updated)

          print("README updated.")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || \
            (git add README.md && \
             git commit -m "chore: update ORCID publications [skip ci]" && \
             git push)
